belief_log_sampling:
  game:
    n_players: 4
    replay_rule: tenhou
  input_glob: /home/naoyuki/mahjong01/Mortal/data/validation/**/*.json.gz
  output_dir: /home/naoyuki/mahjong01/RiichiEnv/data/belief_samples/test30
  summary_path: /home/naoyuki/mahjong01/RiichiEnv/data/belief_samples/test30/summary.json
  model_path: /home/naoyuki/mahjong01/RiichiEnv/models/belief_sampler/test18/model.pth
  device: cuda
  num_logs: 10
  num_samples: 50
  batch_size: 32
  skip_single_action: true
  overwrite: false
  compress_output: true
  seed: null
  temperature: 1.0
  matmul_precision: high
  metadata_key: belief_allocation
  response_metadata_key: belief_response_allocations
  model_class: riichienv_ml.models.belief_allocation.JointHiddenAllocationSampler
  encoder_class: riichienv_ml.features.belief_features.BeliefFeatureEncoder
  model:
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    denoise_num_layers: 3
    denoise_dim_feedforward: 512
    decode_steps: 12
    confidence_method: max_prob
