bc:
  game:
    n_players: 4
    replay_rule: tenhou
  online: false
  offline_algorithm: behavior_cloning
  matmul_precision: high
  data_glob: /home/naoyuki/mahjong01/Mortal/data/training/**/*.json.gz
  val_data_glob: /home/naoyuki/mahjong01/Mortal/data/validation/**/*.json.gz
  output: /home/naoyuki/mahjong01/RiichiEnv/models/behavior_cloning/test42/model.pth
  device: cuda
  batch_size: 64
  lr: 1e-4
  lr_min: 1e-6
  num_epochs: 1
  num_workers: 16
  # Buffers this many log files per worker before shuffling. Keep modest for sequence features.
  shuffle_buffer_files: 64
  limit: 500000
  weight_decay: 0.01
  label_smoothing: 0.0
  value_coef: 1.0
  max_grad_norm: 10.0
  wandb_entity: smly
  wandb_project: riichienv-4p
  wandb_tags: [offline, behavior_cloning, transformer, sequence_features, tenhou, rank_value]
  wandb_mode: offline
  model_class: riichienv_ml.models.transformer.TransformerPolicyNetwork
  dataset_class: riichienv_ml.datasets.mjai_logs.BehaviorCloningRankDataset
  encoder_class: riichienv_ml.features.sequence_features.SequenceFeatureEncoder
  model:
    d_model: 384
    nhead: 8
    num_layers: 6
    dim_feedforward: 1536
    dropout: 0.1
    progression_relative_position_cap: 60
    progression_player_relative_position_cap: 15
    num_actions: 82
    policy_head_type: pointer
    emit_rank: true
    rank_classes: 4
