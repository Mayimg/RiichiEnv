belief_sampler:
  game:
    n_players: 4
    replay_rule: tenhou
  data_glob: /home/naoyuki/mahjong01/Mortal/data/training/**/*.json.gz
  val_data_glob: /home/naoyuki/mahjong01/RiichiEnv/data/self_match/BC/test11/game_*.jsonl
  output: /home/naoyuki/mahjong01/RiichiEnv/models/belief_sampler/test25/model.pth
  device: cuda
  batch_size: 32
  lr: 0.0001
  lr_min: 0.000001
  num_epochs: 1
  num_workers: 8
  shuffle_buffer_files: 128
  sample_keep_prob: 0.1
  # When enabled, this replaces sample_keep_prob for regular belief-allocation samples.
  stratified_sample_keep_prob:
    enabled: true
    riichi: 0.4
    meld1: 0.1
    meld2: 0.2
    meld3plus: 0.5
    closed_start: 0.01
    closed_end: 0.3
    closed_start_discard_count: 0
    closed_end_discard_count: 20
  limit: 500000
  weight_decay: 0.01
  max_grad_norm: 10.0
  matmul_precision: high
  skip_single_action: true
  eval_num_samples: 4
  eval_sample_batches: 2
  wandb_mode: offline
  wandb_tags: [offline, belief_sampler, hidden_allocation, maskgit]
  model_class: riichienv_ml.models.belief_allocation.JointHiddenAllocationSampler
  dataset_class: riichienv_ml.datasets.belief_allocation.BeliefAllocationDataset
  encoder_class: riichienv_ml.features.belief_features.BeliefFeatureEncoder
  model:
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    denoise_num_layers: 3
    denoise_dim_feedforward: 512
    decode_steps: 111
    confidence_method: max_prob
