belief_sampler:
  game:
    n_players: 4
    replay_rule: tenhou
  data_glob: /home/naoyuki/mahjong01/Mortal/data/training/**/*.json.gz
  val_data_glob: /home/naoyuki/mahjong01/RiichiEnv/data/self_match/BC/test11/game_*.jsonl
  output: /home/naoyuki/mahjong01/RiichiEnv/models/belief_sampler/test01/model.pth
  device: cuda
  batch_size: 32
  lr: 0.0001
  lr_min: 0.000001
  num_epochs: 1
  num_workers: 8
  limit: 10000
  weight_decay: 0.01
  max_grad_norm: 10.0
  matmul_precision: high
  skip_single_action: true
  wandb_mode: offline
  wandb_tags: [offline, belief_sampler, hidden_allocation, transformer]
  model_class: riichienv_ml.models.belief_allocation.JointHiddenAllocationSampler
  dataset_class: riichienv_ml.datasets.belief_allocation.BeliefAllocationDataset
  encoder_class: riichienv_ml.features.belief_features.BeliefFeatureEncoder
  model:
    d_model: 256
    nhead: 8
    num_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    decoder_hidden_dim: 256
